[routers]
Router5 ansible_host=192.168.99.5

[switches]
MLS ansible_host=192.168.99.1
Switch3 ansible_host=192.168.99.13
Switch4 ansible_host=192.168.99.14

# Switch4 brukes som testswitch.
# En enhet kan være medlem av flere grupper.
[test_switches]
Switch4

# Switchene som senere skal inngå i EtherChannel.
[etherchannel_switches]
Switch3
Switch4

# Felles innstillinger for alle enhetene.
[all:vars]
ansible_user=admin
ansible_password=Cisco123

# Bruk enable-modus under konfigurasjon.
ansible_become=yes
ansible_become_method=enable
ansible_become_password=Cisco123

# Cisco IOS-tilkobling over SSH.
ansible_connection=ansible.netcommon.network_cli
ansible_network_os=cisco.ios.ios

# Paramiko fungerer ofte bedre med eldre Cisco SSH-algoritmer.
ansible_network_cli_ssh_type=paramiko
