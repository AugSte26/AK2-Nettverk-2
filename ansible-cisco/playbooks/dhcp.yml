---
- name: Configure DHCP
  hosts: routers
  gather_facts: no

  tasks:

    - name: Create DHCP Pool
      cisco.ios.ios_config:
        parents:
          - ip dhcp pool VLAN10
        lines:
          - network 192.168.10.0 255.255.255.0
          - default_router 192.168.10.1
          - dns-server 8.8.8.8
