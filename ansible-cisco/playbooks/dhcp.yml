---
- name: Konfigurer DHCP på Cisco-routere
  hosts: routers
  gather_facts: false

  tasks:
    # Reserverer gateway og andre adresser som ikke skal deles ut.
    - name: Ekskluder reserverte DHCP-adresser
      cisco.ios.ios_config:
        lines:
          - >-
            ip dhcp excluded-address
            {{ item.excluded_start }}
            {{ item.excluded_end }}
      loop: "{{ user_vlans }}"
      loop_control:
        label: "{{ item.dhcp_pool_name }}"

    # Oppretter én DHCP-pool for hvert VLAN i variabelfilen.
    - name: Opprett DHCP-pool
      cisco.ios.ios_config:
        parents:
          - "ip dhcp pool {{ item.dhcp_pool_name }}"
        lines:
          - "network {{ item.network }} {{ item.mask }}"
          - "default-router {{ item.gateway }}"
          - "dns-server {{ item.dns_server }}"
      loop: "{{ user_vlans }}"
      loop_control:
        label: "{{ item.dhcp_pool_name }}"

    # Lagrer running-config til startup-config hvis noe ble endret.
    - name: Lagre konfigurasjonen
      cisco.ios.ios_config:
        save_when: modified
