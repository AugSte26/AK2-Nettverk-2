---
- name: Configure DHCP
  hosts: routers
  gather_facts: no

  tasks:

    - name: Configure DHCP Pool
      cisco.ios.ios_config:
        parents:
          - ip dhcp pool VLAN98
        lines:
          - "network {{ dhcp_network }} {{ dhcp_mask }}"
          - "default-router {{ dhcp_gateway }}"
          - "dns-server {{ dns_server }}"
