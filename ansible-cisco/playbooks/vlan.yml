---
- name: Configure VLANs
  hosts: switches
  gather_facts: no

  tasks:

    - name: Create Management VLAN
      cisco.ios.ios_config:
        lines:
          - "vlan {{ mgmt_vlan }}"
          - "name {{ mgmt_vlan_name }}"

    - name: Create User VLAN
      cisco.ios.ios_config:
        lines:
          - "vlan {{ user_vlan }}"
          - "name {{ user_vlan_name }}"
